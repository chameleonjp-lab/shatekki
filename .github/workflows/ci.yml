# Change-aware tests only. Publication is a separate, explicitly activated workflow.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run every game test
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      node: ${{ steps.select.outputs.node }}
      build: ${{ steps.select.outputs.build }}
      browser: ${{ steps.select.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check selection rules
        run: node --test tests/ci/*.test.mjs
      - name: Select required checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$FULL" = "true" ]; then
            node scripts/ci/plan.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --full
          else
            node scripts/ci/plan.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

  node:
    needs: plan
    if: needs.plan.outputs.node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ci/run-tests.mjs unit
      - run: node scripts/ci/run-tests.mjs integration
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-results
          path: test-results/
          retention-days: 7

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      # Internal prototype build for the expanded browser tests. A different artifact name, so the
      # Pages workflow (which only takes site-dist) can never publish it.
      - run: npm run build:expanded
      - uses: actions/upload-artifact@v4
        with:
          name: internal-expanded-dist
          path: dist-expanded/
          if-no-files-found: error
          retention-days: 7
      # Internal build with the ammo rewards (rules-v2-proposed-r003) for tests/e2e/rewards.spec.ts.
      - run: npm run build:rewards
      - uses: actions/upload-artifact@v4
        with:
          name: internal-rewards-dist
          path: dist-rewards/
          if-no-files-found: error
          retention-days: 7

  browser:
    needs: [plan, build]
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-latest
    # Setup and tests have their own step limits below; this only bounds the whole job.
    timeout-minutes: 20
    # Browser, system libraries and fonts come prebuilt in the image of the lockfile's exact
    # Playwright version (checked by tests/ci/browser-env.test.mjs). Downloading them at run
    # time once took 9 min 7 s on a slow apt mirror and cancelled the tests (run 42260041719).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: 'true'
      CI_PREBUILT: 'true'
      CI_PLAN: ${{ needs.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        timeout-minutes: 5
      - uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: internal-expanded-dist
          path: dist-expanded/
      - uses: actions/download-artifact@v4
        with:
          name: internal-rewards-dist
          path: dist-rewards/
      - name: Check the browser version and the fonts for Japanese, Chinese and Thai text
        timeout-minutes: 2
        run: |
          npx playwright --version
          test "$(npx playwright --version)" = "Version $(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          dpkg-query -W fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf
      - name: Run selected browser tests
        timeout-minutes: 12
        run: node scripts/ci/run-tests.mjs e2e --shard=${{ matrix.shard }}/2
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Keep the original required check name; unexpected skips cannot pass the gate.
  test:
    if: always()
    needs: [plan, node, build, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      NODE_REQUIRED: ${{ needs.plan.outputs.node }}
      BUILD_REQUIRED: ${{ needs.plan.outputs.build }}
      BROWSER_REQUIRED: ${{ needs.plan.outputs.browser }}
      NODE_RESULT: ${{ needs.node.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify all required jobs
        run: node scripts/ci/gate.mjs
